<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore with Walker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <header class="header">

        <a href="#" class="logo">
            <span class="logo-name">WALKER</span>
            <span class="logo-subtitle">TRAVEL</span>
        </a>

        <nav class="nav">
            <a href="#">Destinations</a>
            <a href="#">Services</a>
            <a href="#">How it works</a>
            <a href="#">About</a>
            <a href="#">Reviews</a>
        </nav>

        <button class="plan-button">
            Plan My Trip
        </button>

    </header>

    <section class="hero">
        
        <div class="hero-overlay"></div>

        <div class="hero-content">

            <p class="hero-label">Explore the world with us</p>

            <h1>
                Your next story<br> starts somewhere.
            </h1>

            <p class="hero-description">
                Tell us where you want to go. 
                We'll take care of everything else.
            </p>

            <div class="hero-buttons">

                <button class="hero-primary">
                    Plan My Trip
                </button>

                <button class="hero-secondary">
                    Learn More
                </button>

            </div>

        </div>

    </section>

</body>
</html>
